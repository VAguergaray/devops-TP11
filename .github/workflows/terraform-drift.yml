name: Terraform Drift Detection

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: terraform-prod
  cancel-in-progress: false

jobs:
  drift-detection:
    runs-on: [self-hosted, linux, x64]
    env:
      TF_VAR_postgres_password: ${{ secrets.TF_VAR_POSTGRES_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.1

      - name: Terraform Init
        run: |
          terraform init -reconfigure \
            -backend-config="path=/home/valaxx/.terraform-state/devops-TP11/prod/terraform.tfstate"

      - name: Detect Drift
        id: drift
        run: |
          set +e
          terraform plan -detailed-exitcode \
            -var-file="envs/prod/terraform.tfvars" \
            -no-color

          RESULT=$?
          echo "exitcode=$RESULT" >> "$GITHUB_OUTPUT"

          if [ "$RESULT" -eq 0 ]; then
            echo "No drift detected."
            exit 0
          elif [ "$RESULT" -eq 2 ]; then
            echo "Drift detected."
            exit 0
          else
            echo "Terraform plan failed."
            exit 1
          fi
      - name: Report Drift
        if: steps.drift.outputs.exitcode == '2'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Terraform Drift Detection - PROD',
              body: 'Se detectaron diferencias entre la infraestructura PROD y el estado de Terraform. Revisar el workflow antes de aplicar cambios.'
            });

      - name: Verify Result
        if: steps.drift.outputs.exitcode == '0'
        run: echo "Infraestructura sincronizada. No se detectó drift."
